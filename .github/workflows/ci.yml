name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun ci
        if: steps.modules.outputs.cache-hit != 'true'

      - run: bun audit

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun test
      - run: bun run test:skill

  checks:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun run check
      - run: bun run lint
      - run: bun run fmt:check

  build:
    runs-on: ubuntu-latest
    needs: [install, test, checks]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: searchunit-build
          path: dist/
          retention-days: 1

  node-smoke:
    runs-on: ubuntu-latest
    needs: [install, test, checks, build]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '25', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: searchunit-build
          path: dist

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: node dist/cli.js --help

      - name: Serve a local fixture page
        run: |
          cat > smoke.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>CI smoke fixture for the SearchUnit meta-check run</title>
          <meta name="description" content="A static fixture page served on localhost for the SearchUnit CLI smoke test in CI. It carries every tag the meta check reads so the analyzer status is a pass.">
          <link rel="canonical" href="http://localhost:8137/smoke.html">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="index, follow">
          <meta property="og:title" content="CI smoke fixture for the SearchUnit meta-check run">
          <meta property="og:description" content="A static fixture page served on localhost for the SearchUnit CLI smoke test in CI.">
          <meta property="og:image" content="http://localhost:8137/og.png">
          <meta property="og:url" content="http://localhost:8137/smoke.html">
          <meta property="og:type" content="website">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="CI smoke fixture for the SearchUnit meta-check run">
          <meta name="twitter:description" content="A static fixture page served on localhost for the SearchUnit CLI smoke test in CI.">
          <meta name="twitter:image" content="http://localhost:8137/og.png">
          </head>
          <body><h1>CI smoke fixture</h1></body>
          </html>
          EOF
          python3 -m http.server 8137 --bind 127.0.0.1 &

      - run: sleep 1 && node dist/cli.js meta-check http://localhost:8137/smoke.html --format=json --silent
