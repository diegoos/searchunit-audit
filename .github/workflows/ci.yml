name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun ci

      - run: bun audit

      - run: bun test
      - run: bun run check
      - run: bun run lint
      - run: bun run fmt:check

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node dist/cli.js --help
      - run: node dist/cli.js meta-check https://searchunit.io/ --format=json --silent

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node dist/cli.js --help
      - run: node dist/cli.js meta-check https://searchunit.io/ --format=json --silent

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node dist/cli.js --help
      - run: node dist/cli.js meta-check https://searchunit.io/ --format=json --silent
