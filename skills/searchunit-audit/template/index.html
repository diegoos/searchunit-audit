      function cruxHtml(doc) {
        const inScore = doc.cruxAvailable === true;
        const note =
          doc.cruxNote ||
          (inScore
            ? 'Field Core Web Vitals are in the technical score.'
            : 'The technical score does not include Core Web Vitals.');
        return `<li class="subscore">
            <div class="subscore-head"><span class="subscore-name">CrUX</span><span class="subscore-value is-text">${inScore ? 'In the score' : 'Out of the score'}</span></div>
            <p class="subscore-note">${esc(note)}</p>
          </li>`;
      }

      function heroHtml(doc, counts) {
        const value = doc.headline?.value;
        const has = !(value == null || value === '') && !Number.isNaN(Number(value));
        const n = has ? Number(value) : Number.NaN;
        const text = has ? scoreText(n) : 'no score';
        const label = labelOf(doc.headline?.label) || 'No label';
        const conf = CONF[doc.confidence] || doc.confidence || 'no value';
        const ev = evidenceOf(doc.evidenceQuality) || 'no value';
        const sentence = has
          ? `Score ${text} of 100, ${label.toLowerCase()}. ${bandOf(value)}`
          : bandOf(value);
        const firstStep = doc.priority?.[0]?.title ? ` First step: ${doc.priority[0].title}.` : '';
        const mark = has ? `<span class="scale-mark" style="left: ${clampPct(n)}%"></span>` : '';
        const scaleLabel = has
          ? `Score ${text} on a 0 to 100 scale`
          : 'No score on a 0 to 100 scale';
        return `<section class="hero" id="readiness" aria-labelledby="readiness-title">
            <h2 class="hero-title" id="readiness-title" tabindex="-1">Result</h2>
            <div class="hero-grid">
              <div>
                <p class="hero-num${has ? '' : ' is-empty'}">${esc(text)}${has ? '<small>of 100</small>' : ''}</p>
                <p class="hero-label">${esc(label)}</p>
                <p class="hero-caption">${esc(doc.headline?.caption || 'Readiness')}</p>
                <p class="hero-sentence">${esc(sentence)}${esc(firstStep)}</p>
              </div>
              <ul class="subscores">
                ${subscoreHtml('SEO', doc.seo, 'Google search and the like.')}
                ${subscoreHtml('GEO', doc.geo, 'AI answers that cite the page.')}
                ${cruxHtml(doc)}
              </ul>
            </div>
            <div class="scale">
              <div class="scale-track" role="img" aria-label="${esc(scaleLabel)}"><span></span><span></span><span></span><span></span>${mark}</div>
              <ul class="scale-labels">
                <li>0 to 39: needs a fix</li>
                <li>40 to 59: needs attention</li>
                <li>60 to 79: still moves with a fix</li>
                <li>80 to 100: high in this reading</li>
              </ul>
            </div>
            <dl class="tally">
              <div><dt>Fails</dt><dd>${counts.fails}</dd></div>
              <div><dt>Warnings</dt><dd>${counts.warns}</dd></div>
              <div><dt>Ok</dt><dd>${counts.oks}</dd></div>
              <div><dt>Blockers</dt><dd>${counts.blockers}</dd></div>
            </dl>
            <p class="hero-foot">The score comes from the HTML the server returned. Visits, rank, and AI citation stay out of that number. Confidence ${esc(conf)}. Evidence ${esc(ev)}.</p>
          </section>`;
      }

      function breakdownHtml(rows) {
        if (!rows?.length) return `<p class="empty">This file has no component table.</p>`;
        const items = rows
          .map(
            (row) => `<li class="part">
              <div class="part-head"><span>${esc(row.name)}</span><span class="part-val">${row.score === null ? 'N/A' : esc(formatNum(row.score))}</span></div>
              <div class="bar" aria-hidden="true"><span style="width: ${row.score === null ? 0 : clampPct(row.score)}%"></span></div>
              <p class="part-meta">Weight ${esc(formatNum(row.weight))}, evidence ${esc(evidenceOf(row.evidence))}.</p>
            </li>`,
          )
          .join('');
        return `<p class="muted prose">Each bar is one part of the score. The weight says how much it counts in the total. Lab, on this bar, is what the static HTML shows. CrUX is the field metric.</p>
          <ul class="parts">${items}</ul>`;
      }

      function blockersHtml(rows) {
        if (!rows?.length) return '';
        const items = rows
          .map(
            (row) =>
              `<li class="callout"><span class="glyph fail" aria-hidden="true">×</span><p><strong>Blocker</strong> <code>${esc(row.id)}</code> caps ${esc(row.component)} at ${esc(formatNum(row.cap))}.</p></li>`,
          )
          .join('');
        return `<ul class="callouts">${items}</ul>`;
      }

      function readingHtml(doc) {
        const blockers = blockersHtml(doc.blockers);
        return `<div class="reading">
            <div class="context">${rowsOrNote(doc.context, 'No reading context.', 'No reading context.')}</div>
            <div>
              <h3>Where the score comes from</h3>
              ${breakdownHtml(doc.breakdown)}
            </div>
            ${blockers ? `<div><h3>What caps the score</h3>${blockers}</div>` : ''}
          </div>`;
      }

      function severityChip(severity) {
        if (!severity) return '';
        const [word, cls] = priorityMark(severity);
        return `<span class="mark ${esc(cls)}">${esc(word)}</span>`;
      }

      function idsHtml(ids) {
        if (!ids?.length) return '';
        return `<p class="ids">${ids.map((id) => `<code>${esc(id)}</code>`).join('')}</p>`;
      }

      /* Plan link: the id matches the Plan entry's <details id>, the same anchor the priority list uses. */
      function planHtml(plan) {
        if (!plan) return '';
        const href = `#${encodeURIComponent(String(plan))}`;
        return `<p class="evidence">Plan: <a href="${esc(href)}">${esc(plan)}</a>.</p>`;
      }

      function issueList(items, cls, icon, empty) {
        if (items == null) return '';
        if (!items.length) return `<p class="empty">${esc(empty)}</p>`;
        return `<ul class="items">${items
          .map((item) => {
            const quote = item.quote ? `<blockquote><p>"${esc(item.quote)}"</p></blockquote>` : '';
            const affected = item.affected
              ? `<p class="evidence">Affects: ${esc(item.affected)}.</p>`
              : '';
            return `<li class="item ${cls}">
              <div class="item-head"><span class="glyph ${cls}" aria-hidden="true">${icon}</span><h4>${esc(item.title)}</h4>${severityChip(item.severity)}</div>
              <p>${esc(item.text)}</p>
              ${idsHtml(item.ids)}
              <p class="evidence">Evidence: ${esc(item.evidence || 'no label')}.</p>
              ${affected}
              ${planHtml(item.plan)}
              ${quote}
            </li>`;
          })
          .join('')}</ul>`;
      }

      function diagnosisHtml(doc) {
        if (doc.wrong == null && doc.improve == null) {
          return `<p class="empty">The prose diagnosis is not in this file.</p>`;
        }
        return `<div class="split">
            <div><h3>What is wrong</h3>${issueList(doc.wrong, 'fail', '×', 'No confirmed issues found. Evidence limitation: the list was empty.')}</div>
            <div><h3>What to improve</h3>${issueList(doc.improve, 'warn', '!', 'No confirmed issues found. Evidence limitation: the list was empty.')}</div>
          </div>`;
      }

      function priorityHtml(items) {
        if (items == null) return `<p class="empty">The priority order is not in this file.</p>`;
        if (!items.length) return `<p class="empty">No priority item in this file.</p>`;
        return `<ol class="steps">${items
          .map((item) => {
            const href = item.action ? `#${item.action}` : '';
            const title = href ? `<a href="${esc(href)}">${esc(item.title)}</a>` : esc(item.title);
            const affected = item.affected
              ? `<p class="evidence">Affects: ${esc(item.affected)}.</p>`
              : '';
            return `<li><p class="step-title">${title}${severityChip(item.severity)}</p><p>${esc(item.text || '')}</p>${idsHtml(item.ids)}${affected}</li>`;
          })
          .join('')}</ol>`;
      }

      function findingsHtml(items) {
        if (!items?.length) return `<p class="empty">No finding in this file.</p>`;
        const groups = [];
        for (const finding of items) {
          const last = groups.at(-1);
          if (last && last.source === finding.source) last.items.push(finding);
          else groups.push({ source: finding.source, items: [finding] });
        }
        const blocks = groups
          .map((group) => {
            const count = (severity) => group.items.filter((f) => f.severity === severity).length;
            const fails = count('fail');
            const warns = count('warn');
            const oks = count('pass');
            const parts = [];
            if (fails) parts.push(`${fails} ${fails === 1 ? 'fail' : 'fails'}`);
            if (warns) parts.push(`${warns} ${warns === 1 ? 'warning' : 'warnings'}`);
            if (oks) parts.push(`${oks} ok`);
            parts.push(`${group.items.length} ${group.items.length === 1 ? 'item' : 'items'}`);
            const rows = group.items
              .map((finding, index) => {
                const { word, cls, icon } = sevChip(finding.severity);
                const open =
                  finding.severity === 'fail' && index === 0 && group === groups[0] ? ' open' : '';
                return `<details class="action finding" data-finding data-severity="${esc(finding.severity || 'info')}"${open}>
                  <summary><span class="glyph ${cls}" aria-hidden="true">${icon}</span><span class="row-main"><span class="row-title">${esc(finding.title)}</span><code class="row-id">${esc(finding.id)}</code></span><span class="mark ${cls}">${esc(word)}</span><span class="chev" aria-hidden="true"></span></summary>
                  <div><dl class="fields"><div><dt>Source</dt><dd>${esc(finding.source || 'no source')}</dd></div><div><dt>Detail</dt><dd>${esc(finding.detail || 'no detail')}</dd></div></dl></div>
                </details>`;
              })
              .join('');
            return `<div class="group" data-group>
                <div class="group-head"><h3>${esc(groupLabel(group.source))}</h3><p class="group-count">${esc(parts.join(', '))}</p></div>
                <div class="rows">${rows}</div>
              </div>`;
          })
          .join('');
        return `<div class="tools">
            <div>
              <p class="tool-label" id="severity-label">Severity</p>
              <div class="segmented" role="group" aria-labelledby="severity-label" id="filters">
                <button type="button" data-sev="all" aria-pressed="true">All</button>
                <button type="button" data-sev="fail" aria-pressed="false">Fails</button>
                <button type="button" data-sev="warn" aria-pressed="false">Warnings</button>
                <button type="button" data-sev="pass" aria-pressed="false">Ok</button>
                <button type="button" data-sev="info" aria-pressed="false">Notes</button>
              </div>
            </div>
            <div>
              <label class="tool-label" for="filter-text">Filter by text</label>
              <input id="filter-text" type="search" autocomplete="off" placeholder="Filter findings" />
            </div>
          </div>
          <p id="count" class="count-line" aria-live="polite"></p>
          <p id="filter-empty" class="empty" hidden>No finding matches that filter.</p>
          ${blocks}`;
      }

      function actionsHtml(items) {
        if (items == null) {
          return `<p class="empty">The Plan is not in this file. The order stays in What to fix.</p>`;
        }
        if (!items.length) return `<p class="empty">No Plan entry in this file.</p>`;
        return items
          .map((action) => {
            const [word, cls, icon] = priorityMark(action.severity);
            const decision = (action.decision ?? '').trim();
            const fields = [
              ['Source', action.source],
              ['Location', action.location],
              ['Current → target', `${action.current} → ${action.target}`],
              ['Impact', action.impact],
              ['Owner', action.owner],
              ['Depends on', action.dependsOn],
              ['Decision', decision === 'none' ? '' : decision],
              ['How to fix', action.fix],
              ['Verify', action.verify],
            ]
              .filter((field) => field[1])
              .map(([name, value]) => `<div><dt>${esc(name)}</dt><dd>${esc(value)}</dd></div>`)
              .join('');
            const example = action.example
              ? `<div><p class="fields-label">Example</p><pre><code>${esc(action.example)}</code></pre></div>`
              : '';
            const meta = [`Phase ${action.phase}`, `effort ${action.effort}`].join(', ');
            return `<details class="action" id="${esc(action.id || '')}"${action.open ? ' open' : ''}>
              <summary><span class="glyph ${cls}" aria-hidden="true">${icon}</span><span class="row-main"><span class="row-title">${esc(action.title)}</span><span class="row-meta">${esc(meta)}</span></span><span class="mark ${cls}">${esc(word)}</span><span class="chev" aria-hidden="true"></span></summary>
              <div>${action.why ? `<p class="prose">${esc(action.why)}</p>` : ''}<dl class="fields">${fields}</dl>${example}</div>
            </details>`;
          })
          .join('');
      }

      function checksHtml(items) {
        if (!items?.length) return `<p class="empty">No checks in this file.</p>`;
        const hasNote = items.some((row) => row.note);
        const headers = ['Check', 'Result', 'Evidence', ...(hasNote ? ['Note'] : [])];
        const checkRow = (row) => [
          `<code>${esc(row.slug)}</code>`,
          esc(row.result || ''),
          esc(row.evidence || ''),
          ...(hasNote ? [esc(row.note || '')] : []),
        ];
        // Rows with `not observed` are checks that found no issue. They sit in a closed group after the rest.
        const actionable = items.filter((row) => row.result !== 'not observed');
        const quiet = items.filter((row) => row.result === 'not observed');
        const actionableHtml = actionable.length
          ? tableHtml('', headers, actionable.map(checkRow))
          : '';
        const quietCount = quiet.length;
        const quietLabel = `${quietCount} ${quietCount === 1 ? 'check' : 'checks'} with no issue`;
        const quietHtml = quiet.length
          ? `<details class="checks-quiet"><summary>${esc(quietLabel)}</summary>${tableHtml('', headers, quiet.map(checkRow))}</details>`
          : '';
        return `${actionableHtml}${quietHtml}`;
      }

      // Recurrence states use the same tones as findings: worse is fail, better is ok.
      const RECURRENCE_TONE = {
        new: 'warn',
        recurring: 'info',
        worsened: 'fail',
        improved: 'ok',
        resolved: 'ok',
      };

      function recurrenceHtml(items) {
        const list = items.map((item) => {
          const tone = RECURRENCE_TONE[item.state] || '';
          const plan = item.plan && item.plan !== 'none' ? planHtml(item.plan) : '';
          return `<li class="item ${esc(tone)}">
              <div class="item-head"><span class="glyph ${esc(tone)}" aria-hidden="true">${TONE_ICON[tone] || '·'}</span><h4><code>${esc(item.id)}</code></h4><span class="mark ${esc(tone)}">${esc(item.state)}</span></div>
              ${plan}
            </li>`;
        });
        return `<ul class="items">${list.join('')}</ul>`;
      }

      function sampleHtml(doc) {
        if (doc.sample == null)
          return `<p class="empty">The sample coverage is not in this file.</p>`;
        if (!doc.sample.length) return `<p class="empty">No sample URL in this file.</p>`;
        const rows = doc.sample.map((row) => [
          `<span class="break">${esc(row.url)}</span>`,
          esc(row.role || ''),
          esc(row.template || 'unnamed'),
          esc(row.status || 'no status'),
          esc(row.seo || 'no score'),
        ]);
        const sentence = doc.sampleSentence
          ? `<p class="muted prose">${esc(doc.sampleSentence)}</p>`
          : '';
        return `${tableHtml('', ['URL', 'Role', 'Template', 'Status', 'SEO'], rows)}${sentence}`;
      }

      function crawlersHtml(rows) {
        if (rows == null) return `<p class="empty">The crawlers are not in this file.</p>`;
        if (!rows.length) return `<p class="empty">No crawler in this file.</p>`;
        const allowed = rows.filter((r) => r.status === 'allowed').length;
        const body = rows.map((row) => {
          const [word, cls] = crawlerState(row.status);
          return [`<strong>${esc(row.bot)}</strong>`, markHtml(cls, word), esc(row.role)];
        });
        return `<p>${allowed} of ${rows.length} agents allowed by robots.txt.</p>
          ${tableHtml('Agent, robots.txt status, and catalog role', ['Agent', 'Status', 'Role'], body)}`;
      }

      function headersHtml(rows) {
        if (rows == null) return `<p class="empty">The headers are not in this file.</p>`;
        const body = rows.map((row) => [
          `<strong>${esc(row.name)}</strong>`,
          markHtml(row.tone || '', row.state),
          esc(row.effect),
        ]);
        return tableHtml('Present or absent on the response', ['Header', 'Status', 'Effect'], body);
      }

      function examplesHtml(items) {
        if (!items?.length) return '';
        return items
          .map(
            (item) =>
              `<div class="example"><h3>${esc(item.title || '')}</h3><p class="muted">${esc(item.templates || '')}</p><pre><code>${esc(item.text || '')}</code></pre></div>`,
          )
          .join('');
      }

      function gscHtml(value) {
        if (value == null || value === '')
          return `<p class="empty">Search Console is not in this file.</p>`;
        if (typeof value === 'string')
          return textBlock(value, 'Search Console is not in this file.');
        const summary = value.summary ? `<p class="prose">${esc(value.summary)}</p>` : '';
        const groups = [
          {
            caption: 'Query and page',
            headers: ['Query', 'Page', 'Clicks', 'Impressions', 'Position'],
            rows: (value.queryPages || []).map((row) => [
              row.query,
              row.page,
              row.clicks,
              row.impressions,
              row.position,
            ]),
          },
          {
            caption: 'Striking distance',
            headers: ['Query', 'Page', 'Position'],
            rows: (value.strikingDistance || []).map((row) => [row.query, row.page, row.position]),
          },
          {
            caption: 'Inspection',
            headers: ['URL', 'Verdict'],
            rows: (value.inspections || []).map((row) => [row.url, row.verdict]),
          },
          {
            caption: 'Slice errors',
            headers: ['Slice', 'Reason'],
            rows: (value.errors || []).map((row) => [row.slice, row.reason]),
          },
        ];
        if (!groups.some((group) => group.rows.length)) return summary;
        const tables = groups
          .map((group) =>
            group.rows.length
              ? tableHtml(
                  group.caption,
                  group.headers,
                  group.rows.map((cells) =>
                    cells.map((cell) => esc(cell == null ? '' : String(cell))),
                  ),
                )
              : `<p class="muted">${esc(group.caption)}: None.</p>`,
          )
          .join('');
        return summary + tables;
      }

      function textBlock(value, missing) {
        if (value == null || value === '') return `<p class="empty">${esc(missing)}</p>`;
        if (Array.isArray(value)) {
          if (!value.length) return `<p class="empty">No line in this file.</p>`;
          return `<ul class="lines">${value.map((line) => `<li>${esc(line)}</li>`).join('')}</ul>`;
        }
        return `<p class="prose">${esc(value)}</p>`;
      }

      function validationHtml(items) {
        if (items == null) return `<p class="empty">The recheck list is not in this file.</p>`;
        if (!items.length) return `<p class="empty">No recheck in this file.</p>`;
        return `<ol class="steps">${items
          .map(
            (item) => `<li><p><code>${esc(item.command)}</code></p><p>${esc(item.check)}</p></li>`,
          )
          .join('')}</ol>`;
      }

      // Fixed Limits sentences, from user-report.md. The method sentence is copied verbatim.
      const LIMITS_NO_RANKING =
        'This report states no ranking, traffic, revenue, or citation outcome.';
      const LIMITS_METHOD =
        'The sample judgment reads static HTML. When the HTML is a shell and discovery.renderedPage.mainText is set with status ok, that text is rendered evidence from the CLI. The internal link list is cut at 50. Outbound links are cut at 40. The audit probed the status of up to 25 same-site links. Outbound links are counted, never requested. Citability keeps the 12 highest scores and the 12 lowest scores outside that list. Besides the sample GET, the audit fetches robots.txt, llms.txt, up to 25 sitemap files, and a mobile snapshot of the page. The Chrome render and the Lighthouse lab load the page again when they run. With a CrUX key and a public URL, the CLI also queries the CrUX API. Lighthouse, when status is ok, is lab evidence from Chrome. Lighthouse failed audits do not change the readiness score.';

      // The Cuts line keeps its label. A value that already starts with "Cuts:" is not doubled.
      function cutsLine(value) {
        if (isBlank(value)) return '';
        const text = String(value).replace(/^\s*Cuts:\s*/i, '');
        return `<p class="prose">Cuts: ${esc(text)}</p>`;
      }

      function measureGroup(doc) {
        if (isBlank(doc.multimodal) && isBlank(doc.measurement)) return '';
        const multi = isBlank(doc.multimodal) ? '' : textBlock(doc.multimodal, '');
        const measured = isBlank(doc.measurement) ? '' : textBlock(doc.measurement, '');
        return `<h3 class="sub-title">Measurement</h3>${multi}${measured}`;
      }

      function reputationGroup(doc) {
        if (doc.reputation == null) return '';
        return `<h3 class="sub-title">Site reputation</h3>${textBlock(doc.reputation, 'The reputation check is not in this file.')}`;
      }

      // Order follows user-report.md: six lines, multimodal note, method sentence, Cuts line.
      function limitsBody(doc) {
        return `<p class="prose">${esc(LIMITS_NO_RANKING)}</p>
               ${textBlock(doc.limits, 'The six limit lines are not in this file.')}
               ${measureGroup(doc)}
               <p class="prose">${esc(LIMITS_METHOD)}</p>
               ${cutsLine(doc.cuts)}
               ${reputationGroup(doc)}`;
      }

      function sectionCard(id, title, sub, body) {
        return `<section class="block" id="${id}" aria-labelledby="${id}-title">
          <header class="block-head">
            <h2 id="${id}-title" tabindex="-1">${esc(title)}</h2>
            ${sub ? `<p class="block-sub">${esc(sub)}</p>` : ''}
          </header>
          <div class="block-body">${body}</div>
        </section>`;
      }

      const SITEMAP_SHOWN = 20;
      const IMAGES_SHOWN = 20;
      const LINKS_SHOWN = 30;
      const LLMS_SHOWN = 30;
      const LH_METRICS = [
        ['lcpMs', 'Largest Contentful Paint', ' ms'],
        ['fcpMs', 'First Contentful Paint', ' ms'],
        ['inpMs', 'Interaction to Next Paint', ' ms'],
        ['tbtMs', 'Total Blocking Time', ' ms'],
        ['cls', 'Cumulative Layout Shift', ''],
      ];
      /* Link state by rank: broken first, then redirected, then ok. */
      const LINK_STATE = [
        ['Broken', 'fail'],
        ['Redirect', 'warn'],
        ['Ok', 'ok'],
      ];

      function auditItemsHtml(items) {
        const list = (items || [])
          .map((item) => item.url || (item.node && item.node.selector) || '')
          .filter(Boolean);
        if (!list.length) return '<span class="muted">none listed</span>';
        const shown = list
          .slice(0, 5)
          .map((text) => `<code>${esc(text)}</code>`)
          .join('<br>');
        return list.length > 5
          ? `${shown}<br><span class="muted">${list.length - 5} more</span>`
          : shown;
      }

      function lighthouseHtml(lh) {
        if (!lh || lh.reason === 'not-requested') return '';
        if (lh.status !== 'ok') {
          const hint = lh.install
            ? `<p class="prose">${esc(`${lh.install}, then re-run with -o file.json.`)}</p>`
            : '';
          const state =
            lh.status === 'skipped' ? 'The lab was skipped' : 'The lab run did not finish';
          return `<p class="prose">${state}. Reason: <code>${esc(lh.reason || 'no reason')}</code>. The audit score does not change.</p>${hint}`;
        }
        const metrics = LH_METRICS.filter(([key]) => lh.metrics && lh.metrics[key] != null).map(
          ([key, label, unit]) => ({ label, value: `${formatNum(lh.metrics[key])}${unit}` }),
        );
        const rows = keep([
          {
            label: 'Final URL',
            value: lh.finalUrl,
            href: lh.finalUrl ? safeHref(lh.finalUrl) : '',
          },
          ...metrics,
        ]);
        const failed = lh.failedAudits || [];
        const table = failed.length
          ? tableHtml(
              'Lab audits under a full score, in Lighthouse order',
              ['Audit', 'Category', 'Score', 'Value', 'Items'],
              failed.map((audit) => [
                `<strong>${esc(audit.title)}</strong><br><code>${esc(audit.id)}</code>`,
                esc(audit.category),
                esc(audit.score == null ? 'no score' : scoreText(audit.score * 100)),
                esc(audit.displayValue || ''),
                auditItemsHtml(audit.items),
              ]),
            )
          : '<p class="empty">No lab audit under a full score.</p>';
        return `<div class="sub">
            <h3 class="sub-title">Metrics</h3>
            ${rows.length ? factsHtml(rows) : '<p class="empty">No metric in the lab run.</p>'}
          </div>
          <div class="sub">
            <h3 class="sub-title">Failed audits</h3>
            ${table}
          </div>`;
      }

      function renderHtml(render) {
        if (!render || render.reason === 'not-requested') return '';
        if (render.status !== 'ok') {
          const hint = render.install
            ? `<p class="prose">${esc(`${render.install}, then re-run with -o file.json.`)}</p>`
            : '';
          return `<p class="prose">The Chrome render did not finish. Reason: <code>${esc(render.reason || 'no reason')}</code>. Rendered-only checks are insufficient.</p>${hint}`;
        }
        const onlyAfter = render.linksOnlyAfterRender || [];
        return factsHtml(
          keep([
            { label: 'Title', value: render.title },
            { label: 'H1', value: Array.isArray(render.h1) ? render.h1.join('; ') : render.h1 },
            {
              label: 'Words',
              value: render.wordCount != null ? formatNum(render.wordCount) : null,
            },
            { label: 'Canonical', value: render.canonicalUrl, href: render.canonicalUrl },
            { label: 'Robots', value: render.effectiveRobotsDirective },
            {
              label: 'Internal links',
              value: render.internalLinkCount != null ? formatNum(render.internalLinkCount) : null,
            },
            {
              label: 'Links only after render',
              value: onlyAfter.length
                ? `${formatNum(render.linksOnlyAfterRenderCount ?? onlyAfter.length)}: ${onlyAfter.slice(0, 5).join(', ')}`
                : 'none',
            },
          ]),
        );
      }

      function httpsReadinessHtml(readiness) {
        if (!readiness) return '';
        const rows = [
          ...(readiness.insecureSubresources || []).map((url) => ['Insecure subresource', url]),
          ...(readiness.insecureUrls || []).map((item) => [
            `Insecure URL (${item.field})`,
            item.url,
          ]),
          ...(readiness.devHostUrls || []).map((item) => [
            `Dev host URL (${item.field})`,
            item.url,
          ]),
        ];
        if (!rows.length) {
          return '<p class="empty">Nothing on this page breaks when it is served over HTTPS.</p>';
        }
        return tableHtml(
          'What breaks on the HTTPS production URL',
          ['Kind', 'URL'],
          rows.map(([kind, url]) => [esc(kind), `<span class="break">${esc(url)}</span>`]),
        );
      }

      function structuredHtml(sd) {
        if (!sd) return '';
        const blocks = sd.blocks || [];
        const markup = sd.markup || {};
        const facts = keep([
          {
            label: 'JSON-LD blocks',
            value: sd.jsonld_blocks != null ? formatNum(sd.jsonld_blocks) : null,
          },
          {
            label: 'Parse errors',
            value: sd.parse_errors != null ? formatNum(sd.parse_errors) : null,
          },
          {
            label: 'Blocks without @type',
            value: sd.missingTypeCount != null ? formatNum(sd.missingTypeCount) : null,
          },
          { label: '@graph', value: yn(sd.hasGraph) },
          { label: 'Types', value: (sd.types || []).join(', ') },
          { label: 'Microdata types', value: (markup.microdata_types || []).join(', ') },
          { label: 'RDFa types', value: (markup.rdfa_types || []).join(', ') },
        ]);
        const rows = blocks.map((block) => [
          `<strong>${esc(block.type || 'no type')}</strong>${block.name ? `<br>${esc(block.name)}` : ''}`,
          block.hasRequiredProps ? markHtml('ok', 'Complete') : markHtml('fail', 'Missing props'),
          esc((block.missingProps || []).join(', ') || 'none'),
          esc((block.recommendedMissing || []).join(', ') || 'none'),
        ]);
        const table = rows.length
          ? tableHtml(
              'JSON-LD blocks',
              ['Type', 'Required props', 'Missing required', 'Recommended missing'],
              rows,
            )
          : '<p class="empty">No JSON-LD block on the page.</p>';
        const parse =
          sd.parse_errors > 0
            ? `<p class="evidence">${esc(formatNum(sd.parse_errors))} JSON-LD block(s) did not parse. The audit keeps no error text for them.</p>`
            : '';

        return `${facts.length ? factsHtml(facts) : ''}${table}${parse}`;
      }

      function citabilityHtml(cit) {
        if (!cit) return '';
        const headers = ['Score', 'Words', 'Block', 'Dimensions'];
        const dims = (d) =>
          Object.entries(d || {})
            .map(([name, value]) => `${name.replaceAll('_', ' ')} ${scoreText(value)}`)
            .join(', ');
        const rowsOf = (list) =>
          list.map((block) => [
            esc(scoreText(block.score)),
            esc(formatNum(block.word_count)),
            esc(block.text || block.text_preview || ''),
            esc(dims(block.dimensions)),
          ]);
        const top = cit.blocks || [];
        const weak = cit.weakBlocks || [];
        const facts = keep([
          { label: 'Page score', value: cit.page_score != null ? scoreText(cit.page_score) : null },
          {
            label: 'Citation-ready blocks',
            value: cit.citation_ready_blocks != null ? formatNum(cit.citation_ready_blocks) : null,
          },
          {
            label: 'Blocks in the ideal word range',
            value: cit.ideal_range_blocks != null ? formatNum(cit.ideal_range_blocks) : null,
          },
        ]);
        const opening = cit.opening
          ? `<div><p class="fields-label">Opening paragraph</p><blockquote><p>${esc(cit.opening)}</p></blockquote></div>`
          : '';
        const topTable = top.length
          ? tableHtml('Highest scoring blocks', headers, rowsOf(top))
          : '<p class="empty">No answer block was scored on this page.</p>';
        const weakTable = weak.length
          ? tableHtml('Lowest scoring blocks outside the list above', headers, rowsOf(weak))
          : '';

        return `<div class="sub">
            ${facts.length ? factsHtml(facts) : ''}
            ${opening}
            ${topTable}
            ${weakTable}
          </div>`;
      }

      function headingsHtml(outline) {
        if (!outline) return '';
        const items = outline.filter((item) => item && item.level >= 1 && item.level <= 3);
        if (!items.length) return '<p class="empty">No H1 to H3 heading in the outline.</p>';
        return `<ul class="lines outline">${items
          .map((item) => {
            const level = Number(item.level);
            return `<li data-level="${level}"><code>H${level}</code> ${esc(item.text || '(no text)')}</li>`;
          })
          .join('')}</ul>`;
      }

      function imagesHtml(images) {
        if (!images) return '';
        const items = images.items || [];
        const total = images.total || 0;
        const missing = images.missingAlt || 0;
        if (!total) return '<p class="empty">No image on the page.</p>';
        if (!missing) return '<p class="empty">Every image on the page has an alt attribute.</p>';
        const listed = items.filter((item) => item && item.alt == null);
        const shown = listed.slice(0, IMAGES_SHOWN);
        const scope =
          items.length < total
            ? ` The list reads the first ${formatNum(items.length)} images.`
            : '';
        const list = shown.length
          ? `<ul class="lines">${shown
              .map((item) => `<li><code>${esc(String(item.src).slice(0, 200))}</code></li>`)
              .join('')}</ul>`
          : '<p class="empty">None of the images read is missing an alt attribute.</p>';

        return `<p class="prose">${esc(`${formatNum(missing)} of ${formatNum(total)} images have no alt attribute.${scope}`)}</p>
          ${list}`;
      }

      function linksHtml(status, pageLinks) {
        if (!status) return '';
        const results = status.results || [];
        const labels = new Map();
        const pool = [
          ...((pageLinks && pageLinks.internal) || []),
          ...((pageLinks && pageLinks.outbound) || []),
        ];
        for (const link of pool) {
          if (link && link.href && !labels.has(link.href)) labels.set(link.href, link.text || '');
        }
        const state = (row) => {
          if (row.error || row.status == null || row.status >= 400) return 0;
          if (row.redirects > 0) return 1;
          return 2;
        };
        const table = (scope, caption) => {
          const rows = results
            .filter((row) => row.scope === scope)
            .sort((a, b) => state(a) - state(b));
          if (!rows.length) return `<p class="muted">${esc(caption)}: none probed.</p>`;
          const shown = rows.slice(0, LINKS_SHOWN).map((row) => {
            const [word, tone] = LINK_STATE[state(row)];
            const label = labels.get(row.href);
            return [
              `<span class="break">${esc(row.href)}</span>${label ? `<br><span class="muted">${esc(label)}</span>` : ''}`,
              markHtml(tone, word),
              esc(row.status == null ? 'no response' : row.status),
              esc(row.redirects || 0),
              esc(row.error || ''),
            ];
          });
          const count = `${caption}, showing ${shown.length} of ${rows.length}`;

          return tableHtml(count, ['Link', 'Result', 'Status', 'Redirects', 'Error'], shown);
        };

        return `<div class="sub">
            <p class="prose">The probe checked ${esc(formatNum(status.checked))} of ${esc(formatNum(status.candidates))} stored links.</p>
            ${table('internal', 'Internal links')}
            ${table('outbound', 'Outbound links')}
          </div>`;
      }

      function sitemapUrlsHtml(urls) {
        if (!urls || !urls.length) return '';
        const shown = urls.slice(0, SITEMAP_SHOWN).map((entry) => {
          const href = safeHref(entry.loc);
          const loc = href ? `<a href="${esc(href)}">${esc(entry.loc)}</a>` : esc(entry.loc);
          return [`<span class="break">${loc}</span>`, esc(entry.lastmod || 'no lastmod')];
        });
        return tableHtml(
          `Sitemap URLs, showing ${shown.length} of ${urls.length}`,
          ['URL', 'Lastmod'],
          shown,
        );
      }

      function llmsDetailHtml(detail) {
        if (!detail) return '';
        const issues = detail.issues || [];
        const links = detail.links || [];
        const parts = [];
        if (issues.length) {
          const items = issues
            .slice(0, LLMS_SHOWN)
            .map((issue) => {
              const where = issue.line != null ? ` line ${esc(issue.line)}` : '';
              const text = issue.text ? ` <span class="muted">${esc(issue.text)}</span>` : '';
              return `<li><code>${esc(issue.code)}</code>${where}${text}</li>`;
            })
            .join('');
          parts.push(
            `<div><p class="fields-label">Issues (${esc(issues.length)})</p><ul class="lines">${items}</ul></div>`,
          );
        }
        if (links.length) {
          const rows = links.slice(0, LLMS_SHOWN).map((link) => {
            const href = safeHref(link.url);
            const url = href ? `<a href="${esc(href)}">${esc(link.url)}</a>` : esc(link.url);
            return [esc(link.title || 'no title'), `<span class="break">${url}</span>`];
          });
          parts.push(
            tableHtml(
              `llms.txt links, showing ${rows.length} of ${links.length}`,
              ['Title', 'URL'],
              rows,
            ),
          );
        }
        return parts.join('');
      }

      /* Evidence cards that render only when their data is in the file. */
      function evidenceCards(doc) {
        const cards = [
          [
            'lighthouse',
            'Lighthouse',
            'Lab run on mobile. A lab miss does not change the audit score.',
            lighthouseHtml(doc.lighthouse),
          ],
          [
            'render',
            'Chrome render',
            'The page after JavaScript ran in Chrome. The render adds findings, not score.',
            renderHtml(doc.render),
          ],
          [
            'https-readiness',
            'HTTPS readiness',
            'Local dev server only: what breaks when the page is served over HTTPS.',
            httpsReadinessHtml(doc.httpsReadiness),
          ],
          [
            'structured-data',
            'Structured data',
            'JSON-LD blocks on the page, the type each declares, and the props it lacks.',
            structuredHtml(doc.structuredData),
          ],
          [
            'citability',
            'Citability',
            'Answer blocks in the main content, with their citability dimensions.',
            citabilityHtml(doc.citability),
          ],
          [
            'headings',
            'Headings',
            'The H1 to H3 outline, in document order.',
            headingsHtml(doc.outline),
          ],
          [
            'images',
            'Images',
            'Images on the page that have no alt attribute.',
            imagesHtml(doc.images),
          ],
          [
            'links',
            'Links',
            'Links the probe checked. Broken and redirected links come first.',
            linksHtml(doc.linkStatus, doc.pageLinks),
          ],
        ];

        return cards.filter((card) => card[3]);
      }

      /* Page extract rows, chunked into natural groups. Unknown labels fall into "Other". */
      const PAGE_GROUPS = [
        ['Response', ['Final URL', 'Status', 'Bytes', 'Robots', 'Viewport']],
        ['Classification', ['Page type', 'Site type', 'Language']],
        [
          'Content',
          [
            'Title',
            'Meta description',
            'H1',
            'H2 / H3',
            'Words',
            'Paragraphs, lists, tables',
            'Dates',
            'Author',
            'Rendering',
          ],
        ],
        ['Canonical and media', ['Canonical', 'Images missing alt']],
      ];

      function pageGroupsHtml(rows) {
        const placed = new Set();
        const groups = PAGE_GROUPS.map(([title, labels]) => {
          const picked = rows.filter((row) => labels.includes(row.label));
          for (const row of picked) placed.add(row);
          return [title, picked];
        });
        const rest = rows.filter((row) => !placed.has(row));
        if (rest.length) groups.push(['Other', rest]);
        return groups
          .filter(([, picked]) => picked.length)
          .map(
            ([title, picked]) =>
              `<div class="kv-group"><h4>${esc(title)}</h4>${factsHtml(picked)}</div>`,
          )
          .join('');
      }

      function pageBody(doc) {
        const extract =
          Array.isArray(doc.page) && doc.page.length
            ? pageGroupsHtml(doc.page)
            : rowsOrNote(
                doc.page,
                'The page extract is not in this file.',
                'The page extract is empty.',
              );
        return `<div class="sub">
            <h3 class="sub-title">Page extract</h3>
            ${extract}
          </div>
          <div class="sub">
            <h3 class="sub-title">Sitemap</h3>
            <p class="muted">URLs the site declares to crawlers.</p>
            ${rowsOrNote(doc.sitemap, 'The sitemap is not in this file.', 'The sitemap is empty.')}
            ${sitemapUrlsHtml(doc.sitemapUrls)}
          </div>
          <div class="sub">
            <h3 class="sub-title">llms.txt</h3>
            <p class="muted">Optional file for models. If it is missing, the score does not change.</p>
            ${rowsOrNote(doc.llms, 'The llms.txt status is not in this file.', 'llms.txt is empty.')}
            ${llmsDetailHtml(doc.llmsDetail)}
          </div>
          <div class="sub">
            <h3 class="sub-title">Redirects</h3>
            <p class="muted">Hops to the final URL.</p>
            ${rowsOrNote(doc.redirects, 'The redirects are not in this file.', 'No redirects in this file.')}
          </div>
          <div class="sub">
            <h3 class="sub-title">CrUX</h3>
            <p class="muted">Field speed in Chrome. Without a key, it stays out of the score.</p>
            ${rowsOrNote(doc.crux, 'CrUX is not in this file.', 'CrUX is empty.')}
          </div>`;
      }

      const NAV_READ = [
        ['readiness', 'Result'],
        ['diagnosis', 'Diagnosis'],
        ['priority', 'What to fix'],
        ['findings', 'Findings'],
      ];

      function render(doc) {
        const findings = doc.findings || [];
        const counts = {
          fails: findings.filter((f) => f.severity === 'fail').length,
          warns: findings.filter((f) => f.severity === 'warn').length,
          oks: findings.filter((f) => f.severity === 'pass').length,
          blockers: (doc.blockers || []).length,
        };
        const read = [...NAV_READ];
        if (doc.checks != null) read.push(['checks', 'Checks']);
        if (!isBlank(doc.examples)) read.push(['example', 'Example']);
        if (doc.actions != null) read.push(['actions', 'How to fix']);
        const labCards = evidenceCards(doc);
        const evidence = [
          ['sample', 'Sample'],
          ['page', 'Page'],
          ...labCards.map((card) => [card[0], card[1]]),
          ['crawlers', 'Crawlers'],
          ['security', 'Security'],
          ['profile', 'Google profile'],
          ['search-console', 'Search Console'],
          ['limits', 'Limits'],
        ];
        if (doc.validation != null) evidence.push(['validation', 'Validation']);
        if (!isBlank(doc.recurrence)) evidence.unshift(['recurrence', 'Recurrence']);
        const link = ([id, label]) => `<a href="#${id}">${esc(label)}</a>`;

        return `<div class="layout">
          <nav class="toc" aria-label="Report sections">
            <p class="toc-group">Read</p>
            ${read.map(link).join('')}
            <p class="toc-group">Evidence</p>
            ${evidence.map(link).join('')}
          </nav>
          <div class="main">
            ${heroHtml(doc, counts)}
            ${readingHtml(doc)}
            ${sectionCard('diagnosis', 'Diagnosis', 'What this reading confirms, and what can still improve.', diagnosisHtml(doc))}
            ${sectionCard('priority', 'What to fix', 'The first item is what holds the score most.', priorityHtml(doc.priority))}
            ${sectionCard(
              'findings',
              'Findings',
              'Fail needs a fix. Warning needs a second look. Ok passed. Note explains the context, and the id is how you check it in the CLI.',
              findingsHtml(doc.findings),
            )}
            ${doc.checks == null ? '' : sectionCard('checks', 'Checks', 'One row per workstream slug.', checksHtml(doc.checks))}
            ${isBlank(doc.examples) ? '' : sectionCard('example', 'Example', 'Replacement text for a critical or high finding. One block names the templates it applies to.', examplesHtml(doc.examples))}
            ${doc.actions == null ? '' : sectionCard('actions', 'How to fix', 'Plan entries in order. Each names the location, the change, the owner, and how to verify it.', actionsHtml(doc.actions))}
            <div class="block divider-head" id="evidence-head">
              <header class="block-head">
                <h2>Evidence</h2>
                <p class="block-sub">Below is what this reading opened. The order stays in What to fix.</p>
              </header>
            </div>
            ${isBlank(doc.recurrence) ? '' : sectionCard('recurrence', 'Recurrence', 'Findings that changed since the previous run. The state compares the two runs.', recurrenceHtml(doc.recurrence))}
            ${sectionCard('sample', 'Sample', 'URLs this reading opened.', sampleHtml(doc))}
            ${sectionCard('page', 'Page', 'What the audited URL HTML contains, plus sitemap, llms.txt, redirects, and CrUX.', pageBody(doc))}
            ${labCards.map((card) => sectionCard(card[0], card[1], card[2], card[3])).join('')}
            ${sectionCard('crawlers', 'Crawlers', 'Who robots.txt lets in. The role is the catalog category on the crawler finding.', crawlersHtml(doc.crawlers))}
            ${sectionCard('security', 'Security', 'Response headers, each recorded as present or absent.', headersHtml(doc.headers))}
            ${sectionCard('profile', 'Google profile', 'Profile address from the domain. This screen does not call the network.', rowsOrNote(doc.profile, 'The Google profile is not in this file.', 'The profile is empty.'))}
            ${sectionCard('search-console', 'Search Console', 'Google search data, when this reading includes it.', gscHtml(doc.gsc))}
            ${sectionCard(
              'limits',
              'Limits',
              'What this reading did not see. An item here is not a page error.',
              limitsBody(doc),
            )}
            ${doc.validation == null ? '' : sectionCard('validation', 'Validation', 'How to check again after the fix.', validationHtml(doc.validation))}
          </div>
        </div>`;
      }

      function applyFilter() {
        const pressed = reportRoot.querySelector('#filters button[aria-pressed="true"]');
        const sev = pressed ? pressed.dataset.sev : 'all';
        const query = (reportRoot.querySelector('#filter-text')?.value || '').trim().toLowerCase();
        let count = 0;
        for (const node of reportRoot.querySelectorAll('[data-finding]')) {
          const blob = node.dataset.blob || '';
          const show =
            (sev === 'all' || node.dataset.severity === sev) && (!query || blob.includes(query));
          node.hidden = !show;
          if (show) count += 1;
        }
        for (const group of reportRoot.querySelectorAll('[data-group]')) {
          group.hidden = ![...group.querySelectorAll('[data-finding]')].some(
            (node) => !node.hidden,
          );
        }
        const countNode = reportRoot.querySelector('#count');
        const empty = reportRoot.querySelector('#filter-empty');
        if (countNode) countNode.textContent = count === 1 ? '1 finding' : `${count} findings`;
        if (empty) empty.hidden = count !== 0;
      }

      function indexFindings() {
        for (const node of reportRoot.querySelectorAll('[data-finding]')) {
          node.dataset.blob = node.textContent.toLowerCase();
        }
        applyFilter();
      }

      /* The sticky bar on narrow screens sets --nav-h, which the section scroll margin reads. */
      function navOffset() {
        const bar = reportRoot.querySelector('.toc');
        const narrow = window.matchMedia('(max-width: 59.99rem)').matches;
        return bar && narrow ? bar.offsetHeight : 0;
      }

      function syncNavOffset() {
        document.documentElement.style.setProperty('--nav-h', `${navOffset()}px`);
      }

      /* Keeps the active chip inside the horizontal chip bar on narrow screens. */
      function keepChipVisible(link) {
        const bar = reportRoot.querySelector('.toc');
        if (!link || !bar || bar.scrollWidth <= bar.clientWidth) return;
        const left = link.offsetLeft - (bar.clientWidth - link.offsetWidth) / 2;
        bar.scrollTo({ left: Math.max(0, left), behavior: motionOk() ? 'smooth' : 'auto' });
      }

      let activeId = '';

      function markActive(id) {
        if (!id || id === activeId) return;
        activeId = id;
        for (const link of reportRoot.querySelectorAll('.toc a')) {
          if (link.getAttribute('href') === `#${id}`) {
            link.setAttribute('aria-current', 'true');
            keepChipVisible(link);
          } else {
            link.removeAttribute('aria-current');
          }
        }
      }

      /* The observer marks the top-most section that reaches the upper part of the viewport. */
      function watchSections() {
        const sections = [...reportRoot.querySelectorAll('.toc a')]
          .map((link) => document.getElementById(link.getAttribute('href').slice(1)))
          .filter(Boolean);
        syncNavOffset();
        if (!sections.length) return;
        if ('IntersectionObserver' in window) {
          const inView = new Set();
          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (entry.isIntersecting) inView.add(entry.target.id);
                else inView.delete(entry.target.id);
              }
              /* The section that started most recently in the band is the one being read. */
              const current = sections.filter((section) => inView.has(section.id)).at(-1);
              if (current) markActive(current.id);
            },
            { rootMargin: `-${navOffset()}px 0px -60% 0px` },
          );
          for (const section of sections) observer.observe(section);
        }
        const last = sections.at(-1);
        window.addEventListener(
          'scroll',
          () => {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
              markActive(last.id);
            }
          },
          { passive: true },
        );
        markActive(sections[0].id);
      }

      function showReport(doc) {
        statusNode.hidden = true;
        statusNode.textContent = '';
        reportRoot.hidden = false;
        reportRoot.innerHTML = render(doc);
        indexFindings();
        watchSections();
        fetchedAtNode.textContent = doc.fetchedAt
          ? formatWhen(doc.fetchedAt)
          : 'No date in the file.';
        targetNode.textContent = '';
        const href = safeHref(doc.url);
        if (href) {
          const anchor = document.createElement('a');
          anchor.href = href;
          anchor.textContent = doc.url;
          targetNode.append(anchor);
        } else {
          targetNode.textContent = doc.url || 'No URL in the file.';
        }
        if (doc.command && commandPill) {
          commandPill.hidden = false;
          commandPill.textContent = doc.command;
        } else if (commandPill) {
          commandPill.hidden = true;
        }
        if (pillCrux) {
          pillCrux.hidden = false;
          pillCrux.textContent = doc.cruxAvailable ? 'CrUX in the score' : 'CrUX out of the score';
          pillCrux.title = doc.cruxNote || '';
        }
        if (doc.example) {
          noticeNode.hidden = false;
          noticeNode.textContent = 'Structure example, with no measurement.';
        } else {
          noticeNode.hidden = true;
          noticeNode.textContent = '';
        }
        skipLink.hidden = false;
        let host = '';
        try {
          host = new URL(doc.url).host;
        } catch (error) {
          host = '';
        }
        document.title = host ? `SearchUnit Audit, ${host}` : 'SearchUnit Audit';
        const hashTarget = location.hash ? document.getElementById(location.hash.slice(1)) : null;
        if (hashTarget) hashTarget.scrollIntoView({ block: 'start', behavior: 'auto' });
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const dark = theme === 'dark';
        themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        themeBtn.setAttribute(
          'aria-label',
          dark ? 'Switch to the light theme' : 'Switch to the dark theme',
        );
      }

      function setTheme(theme) {
        applyTheme(theme);
        try {
          localStorage.setItem('searchunit-audit-theme', theme);
        } catch (error) {
          /* the choice lasts only this visit */
        }
      }

      themeBtn.addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      reportRoot.addEventListener('click', (event) => {
        const navLink = event.target.closest('.toc a');
        if (navLink) {
          event.preventDefault();
          goTo(navLink.getAttribute('href').slice(1));
          return;
        }
        const summary = event.target.closest('details.action > summary');
        if (summary) {
          event.preventDefault();
          toggleDetails(summary.parentElement);
          return;
        }
        const button = event.target.closest('#filters button');
        if (!button) return;
        for (const item of reportRoot.querySelectorAll('#filters button')) {
          item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
        }
        applyFilter();
      });

      reportRoot.addEventListener('input', (event) => {
        if (event.target.id === 'filter-text') applyFilter();
      });

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function motionOk() {
        return !reduceMotion.matches;
      }

      /* Jump to a section: the hash updates, the heading takes focus, and the scroll is smooth. */
      function goTo(id, options = {}) {
        const section = document.getElementById(id);
        if (!section) return;
        if (options.push !== false && location.hash !== `#${id}`) {
          history.pushState(null, '', `#${id}`);
        }
        section.querySelector('h2')?.focus({ preventScroll: true });
        section.scrollIntoView({ behavior: motionOk() ? 'smooth' : 'auto', block: 'start' });
      }

      /* Accordion: height and opacity animate. A click mid-run reverses from the current height. */
      function animatePanel(details, panel, from, to, done) {
        panel.style.overflow = 'hidden';
        const anim = panel.animate(
          [
            { height: `${from}px`, opacity: from > 0 ? 1 : 0 },
            { height: `${to}px`, opacity: to > 0 ? 1 : 0 },
          ],
          { duration: 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
        );
        details._anim = anim;
        anim.onfinish = () => {
          panel.style.overflow = '';
          details._anim = null;
          if (done) done();
        };
      }

      function toggleDetails(details) {
        const panel = details.querySelector(':scope > div');
        const willOpen = details.dataset.closing === '1' || !details.open;
        const fromHeight = panel && details.open ? panel.getBoundingClientRect().height : 0;
        details._anim?.cancel();
        details._anim = null;
        delete details.dataset.closing;
        if (panel) panel.style.overflow = '';
        if (!panel || !motionOk() || typeof panel.animate !== 'function') {
          details.open = willOpen;
          return;
        }
        if (willOpen) {
          details.open = true;
          animatePanel(details, panel, fromHeight, panel.scrollHeight);
        } else {
          details.dataset.closing = '1';
          animatePanel(details, panel, fromHeight, 0, () => {
            details.open = false;
            delete details.dataset.closing;
          });
        }
      }

      window.addEventListener('popstate', () => {
        const id = location.hash.slice(1);
        if (id) goTo(id, { push: false });
      });

      window.addEventListener('resize', syncNavOffset);

      /* Open every finding and action for print, then restore the closed ones. */
      window.addEventListener('beforeprint', () => {
        for (const node of reportRoot.querySelectorAll('details')) {
          if (!node.open) {
            node.dataset.printOpened = '1';
            node.open = true;
          }
        }
      });

      window.addEventListener('afterprint', () => {
        for (const node of reportRoot.querySelectorAll('details[data-print-opened]')) {
          node.open = false;
          delete node.dataset.printOpened;
        }
      });

      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

      function boot() {
        const slot = document.querySelector('#audit-data');
        const raw = slot ? slot.textContent.trim() : '';
        if (!raw) {
          showReport(EXAMPLE);
          return;
        }
        try {
          showReport(normalize(JSON.parse(raw)));
        } catch (error) {
          statusNode.hidden = false;
          reportRoot.hidden = true;
          statusNode.textContent = 'The data in this report could not be read.';
        }
      }

      boot();
    </script>
  </body>
</html>
