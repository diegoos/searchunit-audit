<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SearchUnit Audit</title>
    <!-- The page shows site text from the audit. If an escape ever fails, this policy still blocks remote images, requests, and frames. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('searchunit-audit-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Light tokens. Dark tokens repeat below for the system setting without JS and for the toggle. */
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --surface: #ffffff;
        --sunk: #eef1f5;
        --ink: #111827;
        --muted: #4b5563;
        --line: #d6dce5;
        --line-strong: #8b96a6;
        --accent: #0f766e;
        --accent-soft: #e3f2ef;
        --focus: #0f766e;
        --fail: #b42318;
        --fail-soft: #fef3f2;
        --fail-line: #f9b4ae;
        --warn: #b54708;
        --warn-soft: #fffaeb;
        --warn-line: #fedf89;
        --ok: #067647;
        --ok-soft: #ecfdf3;
        --ok-line: #a6f4c5;
        --info: #175cd3;
        --info-soft: #eff8ff;
        --info-line: #b2ddff;
        --hero-bg: #111827;
        --hero-ink: #f9fafb;
        --hero-muted: #cdd5df;
        --hero-track: rgb(255 255 255 / 0.2);
        --hero-accent: #5eead4;
        --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
        /* One spacing scale for every gap and padding. */
        --s-1: 0.25rem;
        --s-2: 0.5rem;
        --s-3: 0.75rem;
        --s-4: 1rem;
        --s-5: 1.5rem;
        --s-6: 2rem;
        /* Zebra tint follows the ink, so it works in light and dark. */
        --zebra: color-mix(in srgb, var(--ink) 6%, transparent);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0d1117;
          --surface: #161b22;
          --sunk: #1c232d;
          --ink: #e6edf3;
          --muted: #9da7b3;
          --line: #2d3643;
          --line-strong: #5f6b7c;
          --accent: #5eead4;
          --accent-soft: #15302d;
          --focus: #5eead4;
          --fail: #fda29b;
          --fail-soft: #2a1614;
          --fail-line: #7a2f28;
          --warn: #fdb022;
          --warn-soft: #2a200c;
          --warn-line: #7a5a12;
          --ok: #6ce9a6;
          --ok-soft: #0f2a1e;
          --ok-line: #23643f;
          --info: #84caff;
          --info-soft: #0f2236;
          --info-line: #245b8a;
          --hero-bg: #0a1f1d;
          --hero-ink: #e6edf3;
          --hero-muted: #a9b6c4;
          --hero-track: rgb(255 255 255 / 0.16);
          --hero-accent: #5eead4;
        }
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0d1117;
        --surface: #161b22;
        --sunk: #1c232d;
        --ink: #e6edf3;
        --muted: #9da7b3;
        --line: #2d3643;
        --line-strong: #5f6b7c;
        --accent: #5eead4;
        --accent-soft: #15302d;
        --focus: #5eead4;
        --fail: #fda29b;
        --fail-soft: #2a1614;
        --fail-line: #7a2f28;
        --warn: #fdb022;
        --warn-soft: #2a200c;
        --warn-line: #7a5a12;
        --ok: #6ce9a6;
        --ok-soft: #0f2a1e;
        --ok-line: #23643f;
        --info: #84caff;
        --info-soft: #0f2236;
        --info-line: #245b8a;
        --hero-bg: #0a1f1d;
        --hero-ink: #e6edf3;
        --hero-muted: #a9b6c4;
        --hero-track: rgb(255 255 255 / 0.16);
        --hero-accent: #5eead4;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Grid tracks never grow past the column, so wide children cannot push the page. */
      .main,
      .block-body,
      .split,
      .facts,
      .fields,
      .items,
      .parts,
      .callouts,
      .subscores,
      .steps,
      .lines,
      .rows,
      .group,
      .reading,
      .hero-grid,
      .layout,
      .scale,
      .action > div,
      .row-main {
        grid-template-columns: minmax(0, 1fr);
      }

      [hidden] {
        display: none !important;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-optical-sizing: auto;
        font-size: 1rem;
        line-height: 1.5;
        text-align: start;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h2 {
        font-size: 1.35rem;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      h3 {
        font-size: 1.05rem;
        line-height: 1.35;
        font-weight: 700;
      }

      h4 {
        font-size: 1rem;
        line-height: 1.4;
        font-weight: 600;
      }

      a {
        color: var(--accent);
        text-underline-offset: 0.18em;
      }

      code {
        font-family: var(--font-mono);
        font-size: 0.86em;
        background: var(--sunk);
        border-radius: 0.25rem;
        padding: 0.05em 0.3em;
        overflow-wrap: anywhere;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .wrap {
        width: min(74rem, 100% - 2rem);
        margin-inline: auto;
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        color: var(--muted);
      }

      .skip {
        position: absolute;
        left: 1rem;
        top: 0.75rem;
        transform: translateY(-220%);
        background: var(--ink);
        color: var(--surface);
        padding: 0.55rem 0.9rem;
        border-radius: 0.4rem;
        z-index: 20;
      }

      .skip:focus {
        transform: none;
      }

      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 0.5rem;
        min-height: 2.5rem;
        padding: 0.4rem 0.85rem;
        cursor: pointer;
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          border-color 150ms ease-out,
          transform 150ms ease-out;
      }

      button:hover {
        border-color: var(--ink);
      }

      button:active:not(:disabled) {
        transform: scale(0.96);
      }

      /* Top bar */
      .masthead {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .masthead-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-block: 0.6rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-logo {
        width: 2rem;
        height: 2rem;
        display: block;
      }

      .brand-logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .brand span {
        color: var(--accent);
      }

      .theme {
        width: 2.5rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Theme icons cross-fade with blur and scale. The state comes from aria-pressed. */
      .theme-icons {
        display: grid;
      }

      .theme-icons svg {
        grid-area: 1 / 1;
        width: 1.25rem;
        height: 1.25rem;
        display: block;
        transition:
          opacity 250ms cubic-bezier(0.2, 0, 0, 1),
          filter 250ms cubic-bezier(0.2, 0, 0, 1),
          transform 250ms cubic-bezier(0.2, 0, 0, 1);
      }

      .theme[aria-pressed='true'] .i-moon,
      .theme[aria-pressed='false'] .i-sun {
        opacity: 0;
        filter: blur(2px);
        transform: scale(0.25);
      }

      /* Page heading: the URL is the title. */
      .page-head {
        padding-block: clamp(1.5rem, 4vw, 2.5rem) 1.5rem;
        border-bottom: 1px solid var(--line);
      }

      .page-url {
        font-size: clamp(1.4rem, 1.05rem + 1.5vw, 2.1rem);
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.015em;
        overflow-wrap: anywhere;
      }

      .page-url a {
        color: inherit;
        text-decoration-thickness: 1px;
      }

      .page-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.6rem;
        margin-top: 0.9rem;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.2rem 0.7rem;
      }

      .chip.warn {
        background: var(--warn-soft);
        border-color: var(--warn-line);
      }

      .status {
        margin-top: 2rem;
        font-size: 1.15rem;
        color: var(--muted);
        max-width: 40rem;
      }

      /* Two columns from 60rem: section list on the left, report on the right. */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.25rem;
        padding-block: 1.25rem 4rem;
      }

      .toc {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }

      .toc-group {
        flex: 0 0 100%;
        margin-top: 0.4rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
      }

      .toc a {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        padding: 0.3rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--surface);
        color: var(--ink);
        text-decoration: none;
        font-size: 0.92rem;
        white-space: nowrap;
        position: relative;
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          border-color 150ms ease-out;
      }

      .toc a:hover {
        border-color: var(--ink);
      }

      .toc a[aria-current='true'] {
        border-color: var(--accent);
        background: var(--accent-soft);
        font-weight: 600;
      }

      .main {
        display: grid;
        gap: 2.75rem;
        min-width: 0;
      }

      /* Score hero: the one dark, bold block on the page. */
      .hero {
        background: var(--hero-bg);
        color: var(--hero-ink);
        border-radius: 0.875rem;
        padding: clamp(1.25rem, 3.5vw, 2.25rem);
      }

      .hero-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--hero-muted);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.75rem;
        margin-top: 1rem;
      }

      .hero-num {
        font-size: clamp(4.5rem, 16vw, 7.5rem);
        line-height: 0.95;
        font-weight: 750;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
      }

      .hero-num small {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--hero-muted);
        margin-left: 0.5rem;
      }

      .hero-num.is-empty {
        font-size: 2rem;
        letter-spacing: 0;
      }

      .hero-label {
        margin-top: 0.8rem;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .hero-caption {
        color: var(--hero-muted);
      }

      .hero-sentence {
        margin-top: 0.9rem;
        max-width: 36ch;
        font-size: 1rem;
      }

      .subscores {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1.1rem;
        align-content: end;
      }

      .subscore-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }

      .subscore-name {
        font-weight: 600;
      }

      .subscore-value {
        font-size: 1.4rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .subscore-value.is-text {
        font-size: 1rem;
        text-align: end;
        overflow-wrap: anywhere;
      }

      .subscore-value small {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--hero-muted);
      }

      .subscore-note {
        margin-top: 0.15rem;
        font-size: 0.88rem;
        color: var(--hero-muted);
      }

      .hero .bar {
        --track: var(--hero-track);
        margin-top: 0.45rem;
      }

      .hero .bar > span {
        background: var(--hero-accent);
      }

      /* Scale: 0 to 100 with the four bands. The marker shows where the score falls. */
      .scale {
        margin-top: 1.75rem;
      }

      .scale-track {
        position: relative;
        display: grid;
        grid-template-columns: 40fr 20fr 20fr 20fr;
        gap: 3px;
        height: 0.6rem;
      }

      .scale-track > span {
        background: var(--hero-track);
        border-radius: 2px;
      }

      .scale-mark {
        position: absolute;
        top: -0.35rem;
        bottom: -0.35rem;
        width: 4px;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--hero-ink);
        box-shadow: 0 0 0 2px var(--hero-bg);
      }

      .scale-labels {
        list-style: none;
        margin: 0.6rem 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.25rem 0.75rem;
        font-size: 0.82rem;
        color: var(--hero-muted);
      }

      .tally {
        margin: 1.75rem 0 0;
        padding-top: 1.25rem;
        border-top: 1px solid var(--hero-track);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .tally dt {
        font-size: 0.85rem;
        color: var(--hero-muted);
      }

      .tally dd {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .hero-foot {
        margin-top: 1.25rem;
        font-size: 0.88rem;
        color: var(--hero-muted);
        max-width: 60ch;
      }

      /* Bars */
      .bar {
        --track: var(--line);
        height: 0.5rem;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      /* Blocks */
      .block {
        border-top: 1px solid var(--line);
        padding-top: 1.75rem;
      }

      .block-head {
        display: grid;
        gap: 0.35rem;
      }

      .block-sub {
        color: var(--muted);
        max-width: 68ch;
      }

      .block-body {
        margin-top: var(--s-5);
        display: grid;
        gap: var(--s-6);
        min-width: 0;
      }

      .sub-title {
        margin: 0;
      }

      .reading {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--s-6);
        min-width: 0;
      }

      .reading > div > h3,
      .reading > h3 {
        margin-bottom: var(--s-3);
      }

      .prose {
        max-width: 68ch;
      }

      /* Component parts */
      .parts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.9rem;
      }

      .part-head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-weight: 600;
      }

      .part-val {
        font-variant-numeric: tabular-nums;
      }

      .part-meta {
        margin-top: 0.2rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-wrap: pretty;
      }

      .callouts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.6rem;
      }

      .callout {
        display: flex;
        gap: 0.7rem;
        align-items: flex-start;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--fail-line);
        border-radius: 0.6rem;
        background: var(--fail-soft);
      }

      .callout p {
        margin: 0;
      }

      /* Glyphs and marks: the shape and the word carry severity, color only reinforces it. */
      .glyph {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.375rem;
        border: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ink);
        font-size: 0.85rem;
        font-weight: 800;
        line-height: 1;
      }

      .glyph.fail {
        color: var(--fail);
        background: var(--fail-soft);
        border-color: var(--fail-line);
      }

      .glyph.warn {
        color: var(--warn);
        background: var(--warn-soft);
        border-color: var(--warn-line);
      }

      .glyph.ok {
        color: var(--ok);
        background: var(--ok-soft);
        border-color: var(--ok-line);
      }

      .glyph.info {
        color: var(--info);
        background: var(--info-soft);
        border-color: var(--info-line);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 600;
        font-size: 0.9rem;
        white-space: nowrap;
        color: var(--ink);
      }

      .mark.fail {
        color: var(--fail);
      }

      .mark.warn {
        color: var(--warn);
      }

      .mark.ok {
        color: var(--ok);
      }

      .mark.info {
        color: var(--info);
      }

      /* Diagnosis: two columns on wide screens, one on narrow. */
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2rem;
      }

      .items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--s-4);
      }

      .item {
        border-left: 3px solid var(--line-strong);
        padding-left: 1rem;
      }

      .item.fail {
        border-left-color: var(--fail);
      }

      .item.warn {
        border-left-color: var(--warn);
      }

      .item-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
      }

      .ids {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-top: 0.35rem;
      }

      .item p {
        margin-top: 0.35rem;
        max-width: 68ch;
      }

      .evidence {
        font-size: 0.85rem;
        color: var(--muted);
      }

      blockquote {
        margin: 0.6rem 0 0;
        padding: 0.1rem 0 0.1rem 0.9rem;
        border-left: 2px solid var(--line-strong);
        color: var(--ink);
        max-width: 68ch;
      }

      blockquote p {
        margin: 0;
      }

      /* Priority: a real sequence, so the markers are numbers. */
      .steps {
        margin: 0;
        padding-left: 1.6rem;
        display: grid;
        gap: 1rem;
        max-width: 68ch;
      }

      .steps li::marker {
        color: var(--accent);
        font-weight: 700;
      }

      .step-title {
        font-weight: 600;
      }

      .step-title a {
        color: var(--ink);
      }

      /* Findings */
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.5rem;
        align-items: flex-end;
        padding: 1rem;
        background: var(--sunk);
        border-radius: 0.6rem;
      }

      .tool-label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--muted);
      }

      .segmented {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .segmented button[aria-pressed='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      input[type='search'] {
        font: inherit;
        font-size: 0.95rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 0.5rem;
        min-height: 2.5rem;
        width: min(100%, 20rem);
        padding: 0.4rem 0.75rem;
      }

      .count-line {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 0.75rem;
      }

      /* Findings: one card per finding, built from the action card classes (.action). */
      .group {
        display: grid;
        gap: var(--s-3);
        min-width: 0;
      }

      .group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s-1) var(--s-4);
        padding-bottom: var(--s-2);
        border-bottom: 1px solid var(--line);
      }

      .group-count {
        font-size: 0.88rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .rows {
        display: grid;
        gap: var(--s-2);
        min-width: 0;
      }

      .row-main {
        display: grid;
        gap: var(--s-1);
        min-width: 0;
      }

      .row-title {
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      /* The id pill sits under the title and is only as wide as its text. */
      .row-id {
        justify-self: start;
        max-width: 100%;
        padding: 0.05em 0.4em;
        border-radius: 0.25rem;
        background: var(--sunk);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .row-meta {
        font-size: 0.88rem;
        color: var(--muted);
      }

      /* Open finding: the key/value list belongs to the card. It runs edge to edge inside the card border, with no box of its own. */
      .action.finding {
        overflow: hidden;
      }

      .action.finding > div {
        padding: 0;
      }

      .action.finding .fields {
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        background: none;
      }

      .chev {
        width: 0.45rem;
        height: 0.45rem;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(-45deg);
        margin-right: 0.3rem;
        transition: transform 180ms ease-out;
      }

      details[open] > summary .chev {
        transform: rotate(45deg);
      }

      /* Actions */
      .action {
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        background: var(--surface);
      }

      .action > summary {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 0.25rem 0.8rem;
        min-height: 2.9rem;
        padding: 0.7rem 0.9rem;
        cursor: pointer;
        list-style: none;
        border-radius: 0.6rem;
        transition: background-color 150ms ease-out;
      }

      .action > summary::-webkit-details-marker {
        display: none;
      }

      .action > summary:hover {
        background: var(--sunk);
      }

      .action[open] {
        border-color: var(--line-strong);
      }

      .action > div {
        padding: 0 0.9rem 1rem;
        display: grid;
        gap: 0.9rem;
      }

      .fields-label {
        margin-bottom: 0.3rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
      }

      pre {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        line-height: 1.5;
        background: var(--sunk);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        margin: 0.5rem 0 0;
        padding: 0.8rem 1rem;
        overflow-x: auto;
        white-space: pre;
        max-width: 100%;
      }

      pre code {
        background: none;
        padding: 0;
        font-size: inherit;
      }

      /* Key/value rows: one row per pair, zebra striped. Label above value on narrow screens, side by side from 40rem. */
      .facts,
      .fields {
        display: grid;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        background: var(--surface);
        overflow: hidden;
      }

      .facts > div,
      .fields > div {
        display: grid;
        gap: var(--s-1);
        padding: var(--s-3) var(--s-4);
        min-width: 0;
      }

      .facts > div:nth-child(even),
      .fields > div:nth-child(even) {
        background: var(--zebra);
      }

      .facts dt,
      .fields dt {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--muted);
      }

      .facts dd,
      .fields dd {
        margin: 0;
        max-width: 68ch;
        color: var(--ink);
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }

      @media (min-width: 40rem) {
        .facts > div,
        .fields > div {
          grid-template-columns: minmax(7rem, 10rem) minmax(0, 1fr);
          column-gap: var(--s-5);
          align-items: baseline;
        }
      }

      /* Tables: wrap in a scroller. Narrow screens stack each row as a labeled block. */
      .scroller {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        background: var(--surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.93rem;
        font-variant-numeric: tabular-nums;
      }

      caption {
        caption-side: top;
        text-align: start;
        font-weight: 600;
        padding: 0.7rem 0.9rem;
        background: var(--sunk);
        border-bottom: 1px solid var(--line);
      }

      th,
      td {
        text-align: start;
        vertical-align: top;
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      thead th {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--sunk);
        white-space: nowrap;
        border-bottom: 1px solid var(--line-strong);
      }

      .lines {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
      }

      .lines li {
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--line);
        max-width: 68ch;
      }

      .lines li:last-child {
        border-bottom: 0;
      }

      /* Heading outline: indent H2 and H3 under the level above. */
      .outline li[data-level='2'] {
        padding-left: 1.25rem;
      }

      .outline li[data-level='3'] {
        padding-left: 2.5rem;
      }

      .divider-head {
        padding-top: 0.25rem;
      }

      .divider-head h2 {
        font-size: 1.5rem;
      }

      /* Spacing: sub-sections, group headings, and the Diagnosis columns. Headings sit closer to their own content than to the previous block. */
      .sub {
        display: grid;
        gap: var(--s-3);
        min-width: 0;
      }

      .kv-group {
        display: grid;
        gap: var(--s-2);
        min-width: 0;
      }

      .kv-group h4 {
        font-size: 0.95rem;
        font-weight: 700;
      }

      .kv-group + .kv-group {
        margin-top: var(--s-5);
      }

      .split h3 {
        margin-bottom: var(--s-4);
      }

      /* Tables share the zebra tint. Stacked rows on narrow screens take the tint on the row. */
      tbody tr:nth-child(even) td {
        background: var(--zebra);
      }

      @media (max-width: 40rem) {
        table.stack tbody tr:nth-child(even) {
          background: var(--zebra);
        }

        table.stack tbody tr:nth-child(even) td {
          background: transparent;
        }
      }

      /* Navigation and motion. Motion answers a user action only: section jump, accordion, filter, theme. */
      .block,
      .hero,
      .action {
        scroll-margin-top: calc(var(--nav-h, 0px) + env(safe-area-inset-top, 0px) + 1.25rem);
      }

      h1,
      h2,
      h3 {
        text-wrap: balance;
      }

      .prose,
      .hero-sentence,
      .hero-foot,
      .item p,
      .hero-num,
      .subscore-value,
      .tally dd,
      .part-val,
      .count-line,
      h2[tabindex='-1']:focus-visible {
        outline-offset: 6px;
        border-radius: 0.25rem;
      }

      .toc a {
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          border-color 150ms ease-out;
      }

      /* Desktop: a thin accent bar marks the current section. */
      @media (min-width: 60rem) {
        .toc a::before {
          content: '';
          position: absolute;
          left: 0;
          top: 0.55rem;
          bottom: 0.55rem;
          width: 2px;
          border-radius: 2px;
          background: var(--accent);
          transform: scaleY(0);
          transition: transform 180ms ease-out;
        }

        .toc a[aria-current='true']::before {
          transform: scaleY(1);
        }
      }

      /* Narrow screens: the section list is one sticky, horizontally scrollable row under the top edge. */
      @media (max-width: 59.99rem) {
        .toc {
          position: sticky;
          top: env(safe-area-inset-top, 0px);
          z-index: 5;
          flex-wrap: nowrap;
          overflow-x: auto;
          overscroll-behavior-x: contain;
          scroll-padding-inline: 1rem;
          scrollbar-width: none;
          padding-block: 0.5rem;
          padding-inline: 0.25rem;
          background: var(--bg);
          border-bottom: 1px solid var(--line);
        }

        .toc::-webkit-scrollbar {
          display: none;
        }

        .toc-group {
          display: none;
        }

        .toc a {
          flex: 0 0 auto;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }
      }

      @media (min-width: 40rem) {
        .hero-grid {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          align-items: end;
        }

        .tally {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .scale-labels {
          grid-template-columns: 40fr 20fr 20fr 20fr;
        }

        .split {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .action > summary {
          grid-template-columns: auto minmax(0, 1fr) auto auto;
        }
      }

      @media (min-width: 60rem) {
        .layout {
          grid-template-columns: 13.5rem minmax(0, 1fr);
          gap: 3.5rem;
          align-items: start;
        }

        .toc {
          position: sticky;
          top: calc(env(safe-area-inset-top, 0px) + 1.25rem);
          max-height: calc(100vh - 2.5rem);
          max-height: calc(100dvh - 2.5rem);
          overflow-y: auto;
          overscroll-behavior: contain;
          align-self: start;
          flex-direction: column;
          align-items: stretch;
          flex-wrap: nowrap;
          gap: 0.1rem;
        }

        .toc-group {
          flex: none;
          margin-top: 1.1rem;
        }

        .toc-group:first-child {
          margin-top: 0;
        }

        .toc a {
          border-color: transparent;
          background: transparent;
          padding-inline: 0.7rem;
        }

        .toc a:hover {
          border-color: transparent;
          background: var(--sunk);
        }

        .toc a[aria-current='true'] {
          border-color: transparent;
          background: var(--accent-soft);
        }

        .hero-grid {
          gap: 3rem;
        }

        .reading {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          align-items: start;
        }

        .reading > .context {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 40rem) {
        table.stack thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }

        table.stack,
        table.stack tbody,
        table.stack tr,
        table.stack td {
          display: block;
          width: 100%;
        }

        table.stack caption {
          display: block;
        }

        table.stack tr {
          padding: 0.6rem 0.9rem;
          border-bottom: 1px solid var(--line);
        }

        table.stack tr:last-child {
          border-bottom: 0;
        }

        table.stack td {
          display: grid;
          grid-template-columns: minmax(0, 7rem) minmax(0, 1fr);
          gap: 0.5rem;
          border: 0;
          padding: 0.2rem 0;
        }

        table.stack td::before {
          content: attr(data-label);
          font-size: 0.85rem;
          color: var(--muted);
        }
      }

      @media print {
        .masthead,
        .toc,
        .tools,
        .count-line,
        .theme,
        .skip {
          display: none !important;
        }

        .layout {
          display: block;
        }

        .hero {
          --hero-bg: #ffffff;
          --hero-ink: #111827;
          --hero-muted: #374151;
          --hero-track: #d1d5db;
          --hero-accent: #111827;
          border: 1px solid #9ca3af;
        }

        .block,
        .item,
        .callout,
        .facts > div,
        details.action {
          break-inside: avoid;
        }

        a {
          color: inherit;
          text-decoration: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }

        button:active:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>

      function esc(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function safeHref(url) {
        try {
          const parsed = new URL(url);
          if (parsed.protocol === 'https:' || parsed.protocol === 'http:') return parsed.href;
        } catch {

        }
        return '';

      function labelOf(value) {
        if (!value) return '';

      function evidenceOf(value) {

      function formatWhen(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return 'Invalid date';
        return new Intl.DateTimeFormat(document.documentElement.lang || 'en', {
          dateStyle: 'long',
          timeStyle: 'short',
        }).format(date);
      }

      function formatNum(value) {
        if (value === null || value === undefined || value === '') return 'no score';
        const number = Number(value);
        if (Number.isNaN(number)) return esc(value);
        return new Intl.NumberFormat(document.documentElement.lang || 'en', {
          maximumFractionDigits: 4,
        }).format(number);
      }

      function scoreText(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return 'no score';
        return String(Math.round(Number(value)));

      function clampPct(value) {
        const n = Number(value);
        if (Number.isNaN(n)) return 0;
        return Math.max(0, Math.min(100, n));

        return text.charAt(0).toUpperCase() + text.slice(1);

      function hasCoreVitals(record) {
        if (!record || !record.metrics) return false;

      function rowsOrNote(rows, missing, empty) {

      function tableHtml(caption, headers, rows) {

      function subscoreHtml(name, score, note) {

        return `<li class="subscore">
